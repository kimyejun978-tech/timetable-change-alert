<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>오늘체육</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <section class="view hero-view">
      <div class="hero-card">
        <span class="eyebrow">오늘 체육, 찾으러 다니지 마세요</span>
        <h1>오늘체육</h1>
        <p class="hero-copy">학생은 자기 반 체육수업을 바로 확인하고, 선생님은 학교 전체 체육수업을 관리합니다.</p>

        <div class="role-grid">
          <a class="role-card role-link" href="./student.html">
            <span class="role-icon">🎒</span>
            <strong>학생으로 시작</strong>
            <small>학교·학년·반을 한 번 설정하면 이후 바로 오늘 체육을 확인합니다.</small>
          </a>

          <a class="role-card role-link teacher-entry" href="./teacher-login.html">
            <span class="role-icon">🏫</span>
            <strong>교사 로그인</strong>
            <small>교사 인증 후 학교 전체 체육수업 등록·수정 화면에 접근합니다.</small>
          </a>
        </div>

        <p class="portal-note">학생 화면과 교사 화면은 별도 페이지로 분리되어 있습니다. 교사용 관리 페이지는 인증 세션이 없으면 열리지 않습니다.</p>
      </div>
    </section>
  </main>
</body>
</html>
