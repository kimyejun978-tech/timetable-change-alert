<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>오늘체육 · 학생</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand-button brand-link" href="./student.html">오늘체육</a>
      <div class="topbar-actions">
        <span id="studentSchoolBadge" class="school-badge"></span>
        <button id="studentResetButton" class="ghost-button small" type="button">학교/반 변경</button>
      </div>
    </header>

    <main>
      <section id="studentSetupView" class="view hidden">
        <div class="page-card narrow">
          <span class="eyebrow">학생 설정</span>
          <h2>학교를 찾아주세요</h2>
          <p class="muted">전국 학교를 검색한 뒤 학년과 반을 한 번만 설정하면 됩니다.</p>

          <form id="studentSchoolSearchForm" class="search-row">
            <input id="studentSchoolSearchInput" type="search" placeholder="예: 대덕소프트웨어마이스터고" autocomplete="off" />
            <button class="primary-button" type="submit">검색</button>
          </form>
          <p id="studentSchoolSearchStatus" class="status-text"></p>
          <div id="studentSchoolResults" class="school-results"></div>

          <form id="studentClassForm" class="form-stack hidden setup-second-step">
            <div id="studentSchoolSummary" class="selection-summary"></div>
            <label>학년
              <select id="studentGrade" required>
                <option value="">선택</option>
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
              </select>
            </label>
            <label>반
              <input id="studentClassNo" type="number" min="1" max="30" placeholder="예: 2" required />
            </label>
            <button class="primary-button full" type="submit">학생 화면 시작</button>
          </form>
        </div>
      </section>

      <section id="studentHomeView" class="view hidden">
        <div class="dashboard-grid student-grid">
          <section class="welcome-block">
            <div>
              <span class="eyebrow" id="studentDateLabel"></span>
              <h2 id="studentClassLabel">오늘의 체육</h2>
              <small id="studentBackendMode" class="muted"></small>
            </div>
            <button class="ghost-button" id="refreshStudentButton" type="button">새로고침</button>
          </section>

          <section id="todayLessons" class="today-lessons"></section>

          <section class="page-card">
            <div class="section-heading">
              <div>
                <span class="eyebrow">이번 주</span>
                <h3>체육 일정</h3>
              </div>
            </div>
            <div id="weekLessonList" class="week-list"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./shared.js" defer></script>
  <script src="./backend.js" defer></script>
  <script src="./student.js" defer></script>
</body>
</html>
