<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>오늘체육 · 교사 로그인</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <section class="view">
      <div class="page-card narrow">
        <a class="text-button back-link" href="./index.html">← 처음 화면</a>
        <span class="eyebrow">Teacher only</span>
        <h2>교사 로그인</h2>
        <p class="muted">학생 포털과 분리된 교사용 관리 화면입니다.</p>

        <section id="teacherSchoolStep">
          <form id="teacherSchoolSearchForm" class="search-row">
            <input id="teacherSchoolSearchInput" type="search" placeholder="소속 학교 검색" autocomplete="off" />
            <button class="primary-button" type="submit">검색</button>
          </form>
          <p id="teacherSchoolSearchStatus" class="status-text"></p>
          <div id="teacherSchoolResults" class="school-results"></div>
        </section>

        <form id="teacherLoginForm" class="form-stack hidden setup-second-step">
          <div id="teacherSchoolSummary" class="selection-summary"></div>
          <label>이름
            <input id="teacherName" type="text" maxlength="20" placeholder="예: 김체육" required />
          </label>
          <label>이메일
            <input id="teacherEmail" type="email" maxlength="120" placeholder="teacher@example.com" required />
          </label>
          <label>교사 비밀번호
            <input id="teacherPassword" type="password" minlength="8" maxlength="72" placeholder="8자 이상" autocomplete="current-password" required />
            <small class="field-help">Supabase 연결 시 실제 이메일/비밀번호 인증을 사용합니다. 로컬 데모에서도 같은 비밀번호로 로그인합니다.</small>
          </label>
          <button id="teacherLoginButton" class="primary-button full" type="submit">교사 화면 들어가기</button>
        </form>

        <section class="security-note">
          <strong id="backendModeLabel">인증 상태 확인 중…</strong>
          <p id="backendModeDescription">Supabase 설정이 있으면 서버 인증과 DB 권한 검증을 사용하고, 설정이 없으면 로컬 데모 모드로 실행됩니다.</p>
        </section>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./config.js" defer></script>
  <script src="/api/public-config" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./shared.js" defer></script>
  <script src="./backend.js" defer></script>
  <script src="./teacher-school-lock.js" defer></script>
  <script src="./teacher-approval-context.js" defer></script>
  <script src="./teacher-login.js" defer></script>
</body>
</html>
