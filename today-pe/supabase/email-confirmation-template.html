<!--
Supabase Auth > Email Templates > Confirm signup
Subject: [오늘체육] 교사 계정 이메일 인증
-->
<!doctype html>
<html lang="ko">
  <body style="margin:0;padding:0;background:#f3f7fc;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#14213d;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f7fc;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dbe5f1;border-radius:24px;overflow:hidden;">
            <tr>
              <td style="padding:34px 34px 12px;">
                <div style="font-size:15px;font-weight:800;color:#2f6df6;margin-bottom:12px;">오늘체육 · 교사 포털</div>
                <h1 style="margin:0;font-size:28px;line-height:1.35;color:#14213d;">이메일 주소를 인증해주세요</h1>
                <p style="margin:18px 0 0;font-size:16px;line-height:1.75;color:#61708c;">
                  {{ .Data.teacher_name }} 선생님, 안녕하세요.<br>
                  오늘체육 교사 계정 가입 요청을 확인하기 위해 이메일 인증이 필요합니다.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 34px 10px;">
                <a href="{{ .ConfirmationURL }}" style="display:block;text-align:center;text-decoration:none;background:#2f6df6;color:#ffffff;font-size:16px;font-weight:800;padding:15px 20px;border-radius:14px;">
                  이메일 인증하고 가입 계속하기
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 34px 34px;">
                <p style="margin:0;font-size:14px;line-height:1.7;color:#7b89a3;">
                  인증이 끝나면 오늘체육 교사 포털로 자동으로 돌아갑니다.<br>
                  본인이 가입을 요청하지 않았다면 이 메일은 무시해도 됩니다.
                </p>
                <div style="height:1px;background:#e7eef7;margin:26px 0 18px;"></div>
                <p style="margin:0;font-size:12px;line-height:1.6;color:#9aa8bf;">
                  이 메일은 오늘체육 교사 계정 이메일 인증을 위해 발송되었습니다.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
