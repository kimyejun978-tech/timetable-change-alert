<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17345b">
  <title>시간표 관리 - 오늘</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/data.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" aria-label="주요 메뉴">
      <div class="brand-block">
        <a class="brand" href="index.html">오늘</a>
        <p class="brand-school" id="sidebar_school">학교를 설정해 주세요</p>
      </div>
      <nav class="side-nav">
        <a href="index.html">오늘</a>
        <a class="active" href="basic.html">시간표</a>
        <a href="result.html">변경 내역</a>
        <a href="settings.html">설정</a>
      </nav>
      <p class="sidebar-caption">학교의 필요한 정보를 한곳에서.</p>
    </aside>

    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">시간표</p>
          <h1>기본 시간표 관리</h1>
          <p class="page-subtitle">현재는 브라우저에 저장하며, 이후 학교 시간표 데이터와 연결할 예정입니다.</p>
        </div>
      </header>

      <section class="panel form-panel">
        <div class="form-section">
          <h2>요일 선택</h2>
          <p class="form-description">요일별 기본 시간표를 입력해 두면 홈에서 오늘 시간표로 표시됩니다.</p>
          <div class="day-selector" aria-label="요일 선택">
            <button type="button" class="day-btn mon">월요일</button>
            <button type="button" class="day-btn tues">화요일</button>
            <button type="button" class="day-btn wednes">수요일</button>
            <button type="button" class="day-btn thurs">목요일</button>
            <button type="button" class="day-btn fri active">금요일</button>
          </div>
        </div>

        <div class="form-section" id="scheduleArea">
          <h2>금요일 기본 시간표</h2>
          <p class="form-description">과목명만 먼저 입력합니다. 수업 장소는 다음 단계에서 별도 설정 기능으로 연결합니다.</p>
          <div class="schedule-input-list"></div>
        </div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="모바일 주요 메뉴">
    <a href="index.html">오늘</a>
    <a class="active" href="basic.html">시간표</a>
    <a href="result.html">변경</a>
    <a href="settings.html">설정</a>
  </nav>
</body>
</html>
