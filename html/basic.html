<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기본 시간표 - 시간표 변경 알리미</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>시간표 변경 알리미</h1>

    <nav>
      <a href="index.html">홈</a>
      <a href="basic.html">기본 시간표</a>
      <a href="settings.html">설정</a>
      <a href="result.html">비교 결과</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>기본 시간표 설정</h2>
      <p>월요일부터 금요일까지 우리 반의 기본 시간표를 입력하는 화면입니다.</p>
    </section>

    <section>
      <h2>요일 선택</h2>

      <!-- 나중에 버튼처럼 꾸미기 -->
      <button>월요일</button>
      <button>화요일</button>
      <button>수요일</button>
      <button>목요일</button>
      <button>금요일</button>
    </section>

    <section>
      <h2>금요일 기본 시간표</h2>

      <form>
        <label>1교시 <input type="text" value="국어"></label>
        <label>2교시 <input type="text" value="과학"></label>
        <label>3교시 <input type="text" value="체육"></label>
        <label>4교시 <input type="text" value="역사"></label>
        <label>5교시 <input type="text" value="수학"></label>
        <label>6교시 <input type="text" value="미술"></label>
        <label>7교시 <input type="text" value="동아리"></label>

        <button type="button">기본 시간표 저장</button>
      </form>
    </section>
  </main>

  <footer>
    <p>저장된 기본 시간표는 오늘 시간표와 비교할 때 사용됩니다.</p>
  </footer>
</body>
</html>
