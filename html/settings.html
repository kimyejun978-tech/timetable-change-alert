<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설정 - 시간표 변경 알리미</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <h1>시간표 변경 알리미</h1>

    <nav>
      <a href="index.html">홈</a>
      <a href="basic.html">기본 시간표</a>
      <a href="settings.html" class="active">설정</a>
      <a href="result.html">비교 결과</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>설정</h2>
      <p>학교, 학년, 반 정보를 설정하는 화면입니다.</p>
    </section>

    <section>
      <h2>학교/반 찾기</h2>

      <form>
        <label>학교 이름 <input type="text" placeholder="학교 이름을 입력하세요"></label>

        <label>
          학년
          <select>
            <option>1학년</option>
            <option>2학년</option>
            <option>3학년</option>
          </select>
        </label>

        <label>
          반
          <select>
            <option>1반</option>
            <option>2반</option>
            <option>3반</option>
            <option>4반</option>
          </select>
        </label>

        <button type="button">학교/반 저장</button>
      </form>
    </section>

    <section>
      <h2>현재 설정</h2>

      <!-- 예시 설정값 -->
      <p>학교: 새솔고등학교</p>
      <p>학년: 1학년</p>
      <p>반: 4반</p>
    </section>
  </main>

  <footer>
    <p>학교와 반 정보는 시간표를 구분하는 기준으로 사용됩니다.</p>
  </footer>
</body>
</html>
