<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비교 결과 - 시간표 변경 알리미</title>
  <!-- 결과 페이지는 현재 보여줄 데이터가 없어서 css만 연결한 상태 -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 다른 페이지랑 헤더 모양 맞추기 -->
  <header>
    <h1>시간표 변경 알리미</h1>

    <nav>
      <a href="index.html">홈</a>
      <a href="basic.html">기본 시간표</a>
      <a href="settings.html">설정</a>
      <a href="result.html" class="active">비교 결과</a>
    </nav>
  </header>

  <main>
    <!-- 원래 오늘 변경 개수를 쓰려고 만든 카드였음 -->
    <section>
      <h2>오늘 변경 요약</h2>

      <!-- 기능을 뺀 이유를 화면에서도 숨기지 않고 안내한다 -->
      <p>컴시간 서버 연결이 차단되어 오늘 시간표를 자동으로 확인할 수 없습니다.</p>
    </section>

    <!-- 나중에 직접 비교 기능을 추가하면 교시별 결과가 들어갈 자리 -->
    <section>
      <h2>변경된 교시</h2>

      <p>실시간 시간표 조회 기능을 제외하여 자동 비교 결과도 제공하지 않습니다.</p>
    </section>
  </main>

</body>
</html>
