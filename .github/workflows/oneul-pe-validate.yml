name: Validate 오늘체육 MVP

on:
  push:
    branches:
      - feat/oneul-pe-mvp
  pull_request:
    branches:
      - main
    paths:
      - 'today-pe/**'
      - 'api/**'
      - 'package.json'
      - '.github/workflows/oneul-pe-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install app dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: JavaScript syntax check
        run: |
          find today-pe api -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Validate portal HTML and JS references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import re
          from pathlib import Path

          pairs = [
              ('today-pe/student.html', 'today-pe/student.js'),
              ('today-pe/teacher-login.html', 'today-pe/teacher-login.js'),
              ('today-pe/teacher.html', 'today-pe/teacher.js'),
          ]

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])

          for html_path, js_path in pairs:
              html = Path(html_path).read_text(encoding='utf-8')
              js = Path(js_path).read_text(encoding='utf-8')
              parser = Parser()
              parser.feed(html)
              duplicate_ids = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicate_ids:
                  raise SystemExit(f'{html_path}: duplicate ids: {duplicate_ids}')

              refs = set(re.findall(r"getElementById\(['\"]([^'\"]+)['\"]\)", js))
              missing = sorted(refs - set(parser.ids))
              if missing:
                  raise SystemExit(f'{js_path}: missing HTML ids in {html_path}: {missing}')

              print(f'OK: {html_path} -> {js_path}, {len(parser.ids)} ids / {len(refs)} refs')

          index = Path('today-pe/index.html').read_text(encoding='utf-8')
          for target in ('student.html', 'teacher-login.html'):
              if target not in index:
                  raise SystemExit(f'index.html missing portal link: {target}')

          required = [
              'today-pe/index.html',
              'today-pe/student.html',
              'today-pe/student.js',
              'today-pe/student-extra.css',
              'today-pe/teacher-login.html',
              'today-pe/teacher-login.js',
              'today-pe/teacher.html',
              'today-pe/teacher.js',
              'today-pe/shared.js',
              'today-pe/backend.js',
              'today-pe/config.js',
              'today-pe/pwa.js',
              'today-pe/push-client.js',
              'today-pe/sw.js',
              'today-pe/manifest.webmanifest',
              'today-pe/icon.svg',
              'today-pe/style.css',
              'today-pe/teacher-extra.css',
              'today-pe/supabase/schema.sql',
              'today-pe/supabase/002_teacher_realtime.sql',
              'today-pe/supabase/003_collaboration_history_notifications.sql',
              'today-pe/supabase/004_push_subscriptions.sql',
              'api/timetable.js',
              'api/push/subscribe.js',
              'api/push/send.js',
              'package.json',
          ]
          for filename in required:
              if not Path(filename).is_file():
                  raise SystemExit(f'Missing required file: {filename}')
          PY

      - name: Check teacher access and RLS architecture
        run: |
          grep -q "getTeacherSession" today-pe/teacher.js
          grep -q "OneulPEBackend" today-pe/teacher.js
          grep -q "OneulPEBackend" today-pe/student.js
          grep -q "Supabase 서버 인증" today-pe/teacher-login.js
          grep -q "register_teacher_profile" today-pe/supabase/schema.sql
          grep -q "get_student_lessons" today-pe/supabase/schema.sql
          grep -q "TEACHER_NOT_VERIFIED" today-pe/supabase/schema.sql
          grep -q "revoke all on public.pe_lessons from anon" today-pe/supabase/schema.sql
          echo 'OK: teacher auth + student read-only RPC architecture is wired'

      - name: Check collaboration history and notifications
        run: |
          grep -q "listSchoolTeachers" today-pe/backend.js
          grep -q "setLessonTeachers" today-pe/backend.js
          grep -q "listLessonHistory" today-pe/backend.js
          grep -q "listStudentNotifications" today-pe/backend.js
          grep -q "lessonTeacherChoices" today-pe/teacher.html
          grep -q "lessonHistoryList" today-pe/teacher.html
          grep -q "studentNotificationList" today-pe/student.html
          grep -q "create table if not exists public.lesson_changes" today-pe/supabase/003_collaboration_history_notifications.sql
          grep -q "set_lesson_teachers" today-pe/supabase/003_collaboration_history_notifications.sql
          grep -q "get_student_notifications" today-pe/supabase/003_collaboration_history_notifications.sql
          echo 'OK: collaboration + history + student notifications are wired'

      - name: Check PWA and Web Push wiring
        run: |
          grep -q "serviceWorker.register" today-pe/pwa.js
          grep -q "pushManager.subscribe" today-pe/pwa.js
          grep -q "self.addEventListener('push'" today-pe/sw.js
          grep -q "create table if not exists public.push_subscriptions" today-pe/supabase/004_push_subscriptions.sql
          grep -q "SUPABASE_SERVICE_ROLE_KEY" api/push/subscribe.js
          grep -q "SUPABASE_SERVICE_ROLE_KEY" api/push/send.js
          grep -q "VAPID_PRIVATE_KEY" api/push/send.js
          grep -q "save_pe_lesson" today-pe/push-client.js
          grep -q "delete_pe_lesson" today-pe/push-client.js
          grep -q "push-client.js" today-pe/teacher.html
          grep -q "pwa.js" today-pe/student.html
          echo 'OK: PWA install + Web Push subscribe/send path is wired'

      - name: Check timetable provider priority
        run: |
          grep -q "fromComcigan" api/timetable.js
          grep -q "fromNeis" api/timetable.js
          grep -q "await fromComcigan" api/timetable.js
          grep -q "await fromNeis" api/timetable.js
          grep -q "/api/timetable" today-pe/teacher.js
          echo 'OK: Comcigan primary -> NEIS fallback path is wired'

      - name: Serve static site and smoke test
        run: |
          python3 -m http.server 4173 --directory . >/tmp/oneul-pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          for page in index.html student.html teacher-login.html teacher.html; do
            curl --fail --silent "http://127.0.0.1:4173/today-pe/$page" | grep -q '오늘체육'
          done
          curl --fail --silent http://127.0.0.1:4173/today-pe/shared.js | grep -q 'schoolInfo'
          curl --fail --silent http://127.0.0.1:4173/today-pe/backend.js | grep -q 'OneulPEBackend'
          curl --fail --silent http://127.0.0.1:4173/today-pe/config.js | grep -q 'SUPABASE_URL'
          curl --fail --silent http://127.0.0.1:4173/today-pe/pwa.js | grep -q 'OneulPEPWA'
          curl --fail --silent http://127.0.0.1:4173/today-pe/push-client.js | grep -q 'OneulPEPush'
          curl --fail --silent http://127.0.0.1:4173/today-pe/sw.js | grep -q 'CACHE_NAME'
          curl --fail --silent http://127.0.0.1:4173/today-pe/manifest.webmanifest | grep -q '오늘체육'
          curl --fail --silent http://127.0.0.1:4173/today-pe/style.css >/dev/null
          curl --fail --silent http://127.0.0.1:4173/today-pe/teacher-extra.css >/dev/null
          curl --fail --silent http://127.0.0.1:4173/today-pe/student-extra.css >/dev/null
          echo 'OK: PWA/static portal smoke test passed'

      - name: Check live Comcigan school search
        continue-on-error: true
        run: |
          node --input-type=module - <<'NODE'
          import Comcigan from 'parse-comcigan';
          const schools = await Comcigan.search('대덕소프트웨어마이스터고');
          console.log('Comcigan schools:', schools.length);
          console.log(schools.slice(0, 3));
          if (!schools.length) process.exitCode = 1;
          NODE

      - name: Check NEIS school search response
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              'Type': 'json',
              'pIndex': '1',
              'pSize': '5',
              'SCHUL_NM': '대덕소프트웨어마이스터고',
          })
          url = 'https://open.neis.go.kr/hub/schoolInfo?' + query
          with urllib.request.urlopen(url, timeout=10) as response:
              data = json.load(response)
          rows = (data.get('schoolInfo') or [{}, {'row': []}])[1].get('row', []) if data.get('schoolInfo') else []
          print('NEIS rows:', len(rows))
          if rows:
              print('First school:', rows[0].get('SCHUL_NM'))
          else:
              print('NEIS RESULT:', data.get('RESULT'))
          PY
